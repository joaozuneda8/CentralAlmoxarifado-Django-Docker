name: Imagem de release
run-name: Imagem de release ${{ inputs.versao }}

# Publica imagem, nunca conecta ou implanta na maquina do Andre.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: Tag aprovada de main (vMAJOR.MINOR.PATCH)
        type: string
        required: true

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validar.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: validar
        env:
          VERSAO: ${{ inputs.versao }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$VERSAO" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "refs/tags/$VERSAO^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          # Nesta primeira versao, publicar somente a tag no HEAD de main.
          # Assim a CI reutilizavel abaixo testa exatamente o commit publicado.
          [[ "$sha" == "$GITHUB_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  testes:
    needs: validar
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: [validar, testes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validar.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/joaozuneda8/centralalmoxarifado-django-docker:${{ inputs.versao }}
          build-args: REVISAO_APP=${{ needs.validar.outputs.sha }}
      - name: Registrar imagem para o deploy manual
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ needs.validar.outputs.sha }}
        run: |
          echo "Commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem: ghcr.io/joaozuneda8/centralalmoxarifado-django-docker@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
