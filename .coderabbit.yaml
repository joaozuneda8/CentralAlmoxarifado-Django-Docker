# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Configuração do CodeRabbit para o Central Almoxarifado (Django).
language: "pt-BR"

reviews:
  profile: "chill"
  poem: false
  path_filters:
    # Planos e specs são registro do processo; o DESIGN.md é cópia do WMS-Almoxarifado.
    - "!docs/superpowers/**"
    - "!docs/DESIGN.md"
  path_instructions:
    - path: "**/migrations/*.py"
      instructions: |
        O sistema ainda não tem dados reais: nenhum servidor em uso, só bancos locais de
        desenvolvimento, recriados quando o schema muda. Mudança de modelo regenera a migration
        existente do app em vez de empilhar uma nova. Não peça migrations de conversão de dados
        antigos, checagem de colisão em dados existentes nem reversão segura de dados. Essa
        regra vale até a importação das planilhas (subprojeto 5), quando passa a haver dados
        de verdade.
    - path: "**/*.py"
      instructions: |
        Textos de interface, mensagens e nomes de código são em português (pt-BR), de propósito.
        Banco: MySQL 8 ou MariaDB (mysqlclient, utf8mb4). Os testes rodam contra MySQL/MariaDB,
        nunca SQLite.
